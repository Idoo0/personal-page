<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="This website is no longer active. Visit my latest portfolio at idoo0.github.io.">
    <title>My Portfolio Has Moved — Idoo0</title>
    <style>
        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            display: flex;
            isolation: isolate;
            padding: 20px;
            background: radial-gradient(ellipse at 25% 30%, #12304a, transparent 60%),
                        radial-gradient(ellipse at 80% 75%, #2b1744, transparent 55%), #05070d;
            color: #fff;
            font-family: system-ui, sans-serif;
        }

        .starfield {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .star {
            position: absolute;
            left: var(--x);
            top: var(--y);
            width: var(--size);
            height: var(--size);
            border-radius: 50%;
            background: #e3f4ff;
            box-shadow: 0 0 6px rgba(180, 220, 255, 0.6);
            opacity: var(--brightness);
            animation: twinkle var(--duration) ease-in-out var(--delay) infinite alternate,
                       drift var(--drift-duration) ease-in-out var(--drift-delay) infinite alternate;
        }

        @keyframes twinkle {
            from { opacity: var(--brightness); }
            to { opacity: 0.2; }
        }

        @keyframes drift {
            from { transform: translate3d(0, 0, 0); }
            to { transform: translate3d(var(--drift-x), var(--drift-y), 0); }
        }

        @media (prefers-reduced-motion: reduce) {
            .star { animation: none; }
        }

        .banner {
            position: relative;
            flex: 0 1 600px;
            min-width: 0;
            margin: auto;
            padding: clamp(28px, 6vw, 44px);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 20px;
            background: linear-gradient(135deg,
                rgba(255, 255, 255, 0.12),
                rgba(255, 255, 255, 0.035) 55%,
                rgba(190, 160, 255, 0.065));
            -webkit-backdrop-filter: blur(18px) saturate(150%);
            backdrop-filter: blur(18px) saturate(150%);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35),
                        inset 0 1px 0 rgba(255, 255, 255, 0.28),
                        inset 0 -1px 0 rgba(255, 255, 255, 0.04);
            text-align: center;
        }

        .label {
            margin: 0 0 18px;
            color: #00f3ff;
            font-family: ui-monospace, monospace;
            font-size: 12px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 16px;
            font-size: clamp(28px, 5vw, 36px);
            line-height: 1.2;
        }

        .description {
            margin: 0 auto 28px;
            max-width: 480px;
            color: #c5c9d4;
            font-size: 16px;
            line-height: 1.7;
        }

        a {
            display: inline-flex;
            flex-direction: column;
            gap: 6px;
            max-width: 100%;
            padding: 14px 24px;
            border-radius: 8px;
            background: #00f3ff;
            color: #050505;
            font-weight: 700;
            text-decoration: none;
        }

        a small {
            font-family: ui-monospace, monospace;
            font-size: 12px;
            font-weight: 400;
        }

        a:hover { background: #87faff; }
        a:focus-visible { outline: 3px solid #fff; outline-offset: 5px; }
    </style>
</head>
<body>
    <div class="starfield" aria-hidden="true"></div>
    <main class="banner">
        <p class="label">My portfolio has moved</p>
        <h1>This website is no longer active.</h1>
        <p class="description">Explore my latest work and projects at my new portfolio.</p>
        <a href="https://idoo0.github.io/">
            <span>Visit my new portfolio <span aria-hidden="true">↗</span></span>
            <small>idoo0.github.io</small>
        </a>
    </main>
    <script>
        const stars = document.createDocumentFragment();
        for (let i = 0; i < 160; i++) {
            const star = document.createElement('span');
            star.className = 'star';
            star.style.setProperty('--x', `${Math.random() * 100}%`);
            star.style.setProperty('--y', `${Math.random() * 100}%`);
            star.style.setProperty('--size', `${1 + Math.random() * 2}px`);
            star.style.setProperty('--brightness', 0.4 + Math.random() * 0.6);
            star.style.setProperty('--duration', `${3 + Math.random() * 5}s`);
            star.style.setProperty('--delay', `${-Math.random() * 8}s`);
            star.style.setProperty('--drift-x', `${Math.random() * 160 - 80}px`);
            star.style.setProperty('--drift-y', `${-40 - Math.random() * 80}px`);
            star.style.setProperty('--drift-duration', `${24 + Math.random() * 24}s`);
            star.style.setProperty('--drift-delay', `${-Math.random() * 48}s`);
            stars.appendChild(star);
        }
        document.querySelector('.starfield').appendChild(stars);
    </script>
</body>
</html>
